name: Compiler MinouFlix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Générer le projet Android
        run: flutter create --platforms=android --org fr.maison --project-name minouflix .
      - name: Manifeste (Android TV, trafic http des serveurs IPTV)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace("<application", '<uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <uses-feature android:name="android.hardware.microphone" android:required="false"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n    <application android:usesCleartextTraffic="true" android:banner="@mipmap/ic_launcher"', 1)
          s = s.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>', 1)
          s = s.replace("</activity>", '<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/><meta-data android:name="flutter_deeplinking_enabled" android:value="false"/><intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="minouflix"/></intent-filter>\n        </activity>', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          sed -i 's/minSdk = .*/minSdk = 23/; s/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle* || true
      - name: Mini-fenêtre (PiP) Android
        run: |
          python3 - <<'PY'
          import glob
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          s = s.replace("<activity", '<activity android:supportsPictureInPicture="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          f = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)[0]
          open(f, "w", encoding="utf-8").write("""package fr.maison.minouflix

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var armed = false
              private fun enter() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                      } catch (e: Exception) {}
                  }
              }
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "minou/fps").setMethodCallHandler { call, result ->
                      if (call.method == "set") { matchFps((call.arguments as? Number)?.toDouble() ?: 0.0); result.success(null) } else result.notImplemented()
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "minou/pip").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "arm" -> { armed = call.arguments == true; result.success(null) }
                          "enter" -> { enter(); result.success(null) }
                          "isTv" -> {
                              val ui = (getSystemService(android.content.Context.UI_MODE_SERVICE) as android.app.UiModeManager).currentModeType == android.content.res.Configuration.UI_MODE_TYPE_TELEVISION
                              val pm = packageManager
                              result.success(ui || pm.hasSystemFeature("android.software.leanback") || pm.hasSystemFeature("android.hardware.type.television"))
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
              override fun onUserLeaveHint() { if (armed) enter() }
              // la télé s'adapte à la cadence de la vidéo : mode d'affichage dont la fréquence est un multiple de fps
              private fun matchFps(fps: Double) {
                  if (Build.VERSION.SDK_INT < 23) return
                  try {
                      val a = window.attributes
                      if (fps <= 0.0) { a.preferredDisplayModeId = 0; window.attributes = a; return }
                      val d = windowManager.defaultDisplay
                      val cur = d.mode
                      var best = 0
                      var bestErr = 1e9
                      for (m in d.supportedModes) {
                          if (m.physicalWidth != cur.physicalWidth || m.physicalHeight != cur.physicalHeight) continue
                          val k = Math.round(m.refreshRate / fps).toInt()
                          if (k < 1) continue
                          val err = Math.abs(m.refreshRate - fps * k)
                          if (err < bestErr - 0.01) { bestErr = err; best = m.modeId }
                      }
                      if (best != 0 && bestErr < 0.6) { a.preferredDisplayModeId = best; window.attributes = a }
                  } catch (e: Exception) {}
              }
          }
          """)
          PY
      - run: flutter pub get
      - name: Icône (logo MinouFlix) et nom
        run: |
          sed -i 's/^  ios: true/  ios: false/' pubspec.yaml
          dart run flutter_launcher_icons
          sed -i 's/android:label="[^"]*"/android:label="MinouFlix"/' android/app/src/main/AndroidManifest.xml
      - name: Bannière Android TV (le logo carré ne doit pas être étiré en 16/9)
        run: |
          pip install pillow
          mkdir -p android/app/src/main/res/drawable-xhdpi
          python3 tools/tv_banner.py android/app/src/main/res/drawable-xhdpi/tv_banner.png
          sed -i 's#android:banner="@mipmap/ic_launcher"#android:banner="@drawable/tv_banner"#' android/app/src/main/AndroidManifest.xml
          grep -c 'tv_banner' android/app/src/main/AndroidManifest.xml
      - name: Signature stable (permet la mise à jour par-dessus l'appli installée)
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - run: flutter build apk --release --dart-define=UPDATE_URL=${{ secrets.UPDATE_URL }} --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }} --dart-define=SUBDL_KEY=${{ secrets.SUBDL_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: minouflix-apk, path: build/app/outputs/flutter-apk/app-release.apk }
      - name: Bundle Play Store (.aab), seulement si le message de commit contient [aab]
        if: contains(github.event.head_commit.message, '[aab]')
        run: flutter build appbundle --release --dart-define=UPDATE_URL=${{ secrets.UPDATE_URL }} --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }} --dart-define=SUBDL_KEY=${{ secrets.SUBDL_KEY }}
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[aab]')
        with: { name: minouflix-aab, path: build/app/outputs/bundle/release/app-release.aab }

  ios:
    # machines Mac comptées 10 fois plus cher : seulement à la demande (message de commit contenant [ios] ou lancement manuel)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Générer le projet iOS
        run: flutter create --platforms=ios --org fr.maison --project-name minouflix .
      - name: Info.plist (trafic http des serveurs IPTV)
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :FlutterDeepLinkingEnabled bool false" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string MinouFlix utilise le micro uniquement quand vous appuyez sur le bouton micro de la recherche, pour dicter le titre d un film ou d une série." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string MinouFlix utilise la reconnaissance vocale d Apple pour transformer votre voix en texte dans la recherche. Rien n est enregistré par l application." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string minouflix" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile
      - run: flutter pub get
      - name: Icône (logo MinouFlix) et nom
        run: |
          sed -i '' 's/^  android: true/  android: false/' pubspec.yaml
          dart run flutter_launcher_icons
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MinouFlix" ios/Runner/Info.plist
      - run: flutter build ios --release --no-codesign --dart-define=UPDATE_URL=${{ secrets.UPDATE_URL }} --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }} --dart-define=SUBDL_KEY=${{ secrets.SUBDL_KEY }}
      - name: IPA non signée (SideStore la signe à l'installation)
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry MinouFlix.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: minouflix-ipa, path: MinouFlix.ipa }

  windows:
    # à la demande (message de commit contenant [win] ou lancement manuel) : installateur .exe + zip portable
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[win]')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Générer le projet Windows
        run: flutter create --platforms=windows --org fr.maison --project-name minouflix .
      - name: Titre de la fenêtre
        run: sed -i 's/L"minouflix"/L"MinouFlix"/' windows/runner/main.cpp
      - run: flutter pub get
      - name: Icône (logo MinouFlix)
        run: |
          printf 'flutter_launcher_icons:\n  android: false\n  ios: false\n  image_path: "assets/icon.png"\n  windows:\n    generate: true\n    image_path: "assets/icon.png"\n    icon_size: 256\n' > icons-windows.yaml
          dart run flutter_launcher_icons -f icons-windows.yaml
      - run: flutter build windows --release --dart-define=UPDATE_URL=${{ secrets.UPDATE_URL }} --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }} --dart-define=SUBDL_KEY=${{ secrets.SUBDL_KEY }}
      - name: Installateur (.exe) et zip portable
        run: |
          choco install innosetup -y --no-progress
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$V" tools/windows/minouflix.iss
          cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../dist/MinouFlix-portable.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: minouflix-windows, path: dist/ }
