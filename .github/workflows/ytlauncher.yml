name: Tuile YouTube
on:
  workflow_dispatch:
  push:
    paths: ['tools/ytlauncher/**', '.github/workflows/ytlauncher.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: bash tools/ytlauncher/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: ytlauncher-apk, path: tools/ytlauncher/out/YouTube-launcher.apk }
