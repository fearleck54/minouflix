name: minouflix
description: MinouFlix - lecteur IPTV autonome (sans serveur), iOS et Android TV.
publish_to: "none"
version: 1.0.244+244

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  speech_to_text: ^7.0.0
  archive: ^3.6.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  youtube_explode_dart: ^3.1.0
  cast: ^2.1.0
  bonsoir: ^7.1.6      # recherche des Chromecast sur le réseau (le module `cast` embarque une recherche trop ancienne : on n'utilise que sa partie connexion)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/clubs/
    - assets/logo.svg
    - assets/chan_logos.json
    - assets/rights.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
